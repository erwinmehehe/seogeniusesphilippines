name: Build and deploy SEO Geniuses Philippines
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install -r requirements.txt
      - name: Configure Pages
        id: pages
        uses: actions/configure-pages@v5
      - name: Build for the actual hosting URL
        env:
          BASE_URL: ${{ steps.pages.outputs.base_url }}
        run: |
          if [ "$BASE_URL" = "https://seogeniusesphilippines.com" ]; then
            python build.py --base-url "$BASE_URL" --indexable
          else
            python build.py --base-url "$BASE_URL"
          fi
      - run: python check.py
      - uses: actions/upload-pages-artifact@v4
        with:
          path: dist
  deploy:
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
